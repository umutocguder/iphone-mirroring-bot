<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="128" fill="#090D16" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#iphoneGrad)" stroke-width="2" stroke-dasharray="12 16" opacity="0.4" />

  <!-- iPhone Silhouette Outer Body -->
  <rect x="146" y="70" width="220" height="372" rx="44" fill="#131B2E" stroke="url(#iphoneGrad)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Screen Glass Area -->
  <rect x="160" y="86" width="192" height="340" rx="34" fill="#0A0E17" stroke="#1E293B" stroke-width="2" />

  <!-- Dynamic Island / Speaker Notch -->
  <rect x="226" y="102" width="60" height="14" rx="7" fill="#1E293B" />
  <circle cx="274" cy="109" r="3" fill="#3B82F6" />

  <!-- Bot AI Core Face on Screen -->
  <g transform="translate(256, 240)">
    <!-- Bot Eyes -->
    <rect x="-55" y="-30" width="34" height="20" rx="10" fill="#38BDF8" filter="url(#glow)" />
    <rect x="21" y="-30" width="34" height="20" rx="10" fill="#38BDF8" filter="url(#glow)" />
    <!-- Eye Pupils -->
    <circle cx="-38" cy="-20" r="5" fill="#FFFFFF" />
    <circle cx="38" cy="-20" r="5" fill="#FFFFFF" />

    <!-- Bot Smile Wave / Signal Curve -->
    <path d="M -40 25 Q 0 50 40 25" fill="none" stroke="url(#iphoneGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Automation Sparkle / Lightning Nodes -->
  <path d="M 256 320 L 250 350 L 265 350 L 245 385" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Home Indicator Bar -->
  <rect x="216" y="412" width="80" height="5" rx="2.5" fill="#64748B" />
</svg>
